name: marc-clearing-v31

services:
  kafka:
    image: apache/kafka:4.3.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/create-topics.sh

  cassandra:
    image: cassandra:4.1.11
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: marc-clearing
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh localhost 9042 -e "SELECT release_version FROM system.local" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1.11
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./init-cassandra-v31.cql:/init.cql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - cqlsh cassandra 9042 -f /init.cql

volumes:
  cassandra-data:
