global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/clearing-rules.yml

scrape_configs:
  - job_name: clearing-engine
    static_configs:
      - targets:
          - host.docker.internal:8080

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
