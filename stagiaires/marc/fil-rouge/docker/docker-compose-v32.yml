name: marc-clearing-v32

services:
  kafka:
    image: apache/kafka:4.3.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/create-topics.sh

  cassandra:
    image: cassandra:4.1.11
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: marc-clearing
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh localhost 9042 -e "SELECT release_version FROM system.local" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1.11
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./init-cassandra-v31.cql:/init.cql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - cqlsh cassandra 9042 -f /init.cql

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    ports:
      - "16686:16686"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:16686/
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      jaeger:
        condition: service_healthy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - components
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      alertmanager:
        condition: service_healthy
    ports:
      - "9090:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/clearing-rules.yml:/etc/prometheus/clearing-rules.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:9090/-/healthy
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    depends_on:
      webhook:
        condition: service_healthy
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:9093/-/healthy
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  webhook:
    image: python:3.13.5-alpine3.22
    command:
      - python
      - /app/app.py
    ports:
      - "8081:8081"
    volumes:
      - webhook-data:/data
      - ./observability/webhook/app.py:/app/app.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8081/health')
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  grafana:
    image: grafana/grafana:13.0.2
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  cassandra-data:
  grafana-data:
  webhook-data:
